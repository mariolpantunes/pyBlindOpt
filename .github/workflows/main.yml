name: Python CI

# The same gate as ess and torann, so a change that passes locally in one
# repository passes in all three. torann adds two Rust steps on top of this;
# nothing else differs.
#
# flake8 ran here before, in a shape that could not fail: the second
# invocation passed --exit-zero, so everything except syntax errors and
# undefined names was reported and then ignored. The tools below all block.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned. The pre-commit hooks are `language: system` so that a
          # commit and this workflow run the same check -- which only holds if
          # both sides run the same version. Unpinned, a ruff release that
          # enables new rules by default fails a PR that changed none of the
          # code it flags, which is exactly what happened at 0.16.
          pip install ruff==0.16.1 basedpyright==1.39.8 vulture==2.16
          pip install .

      - name: Lint with Ruff
        # `src` alone reported green over 33 errors in tracked files: the
        # tests and the benchmark harness are a third of the Python here and
        # were never opened by the gate.
        run: ruff check src test examples

      - name: Type-check with basedpyright
        run: basedpyright

      - name: Dead code with Vulture
        run: vulture

      - name: Run tests
        run: python -m unittest discover -s test
