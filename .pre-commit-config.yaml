# The CI gate, moved to commit time.
#
# Every Python hook below is `language: system`, not a pinned mirror. A mirror
# would fetch its own copy of ruff or basedpyright and run it against a config
# that pre-commit chose, which is how a repository ends up with hooks that pass
# and CI that fails. These call the tools already installed in the environment
# and let them read `pyproject.toml`, so `git commit` and `.github/workflows`
# are running the same check with the same settings by construction.
#
# `pass_filenames: false` on the whole-project tools is deliberate. basedpyright
# and vulture both need to see every file to be correct -- vulture calls a
# function dead when nothing references it, and handing it only the staged files
# means everything they reference looks unreferenced. Type-checking one file in
# isolation fails the same way.
#
# `files` rather than `types: [python]` on the project-wide hooks: they are
# driven by pyproject.toml (ruff rules, basedpyright mode, vulture paths, any
# coverage threshold), so a commit that changes only that file must still run
# them. Filtering on file *type* skipped them all at exactly the moment the
# configuration governing them was being edited.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
        # Benchmark output is JSONL in the hundreds of megabytes and belongs in
        # examples/out, which is ignored. This catches it being force-added.

  - repo: local
    hooks:
      - id: ruff
        name: ruff (src, test, examples)
        entry: ruff check src test examples
        language: system
        files: '(\.py$|^pyproject\.toml$|^setup\.cfg$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$|^setup\.cfg$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture
        language: system
        files: '(\.py$|^pyproject\.toml$|^setup\.cfg$)'
        pass_filenames: false

      - id: coverage
        name: coverage (unittest, --fail-under)
        # The same run as `unittest`, measured, and kept separate so a
        # coverage drop reads as a coverage failure rather than a test one.
        # The floor ratchets: raise it when the number rises, never lower it
        # to make a commit pass.
        entry: >-
          bash -c 'PYTHONPATH=src venv/bin/python -m coverage run
          --source=pyBlindOpt -m unittest discover -s test -q &&
          venv/bin/python -m coverage report --fail-under=90'
        language: system
        files: '(\.py$|^pyproject\.toml$|^setup\.cfg$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        # PYTHONPATH=src, not a bare `python`: CI runs `pip install .` first,
        # but a commit hook has no such step and the interpreter on PATH is
        # whoever's -- usually one without this package installed. Testing the
        # working tree is also the more useful thing to check before a commit.
        # venv/bin/python, not a bare `python`: the interpreter on PATH is
        # /usr/bin/python, which does not have this project's dependencies, so
        # every test module fails to import and the hook can never pass. CI
        # installs the package first and has no such problem; a commit hook does.
        entry: env PYTHONPATH=src venv/bin/python -m unittest discover -s test
        language: system
        files: '(\.py$|^pyproject\.toml$|^setup\.cfg$)'
        pass_filenames: false
