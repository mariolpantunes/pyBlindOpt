<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="pyBlindOpt — derivative-free optimization">
  <title>pyBlindOpt — derivative-free optimization</title>
  <desc>The search space, with the basin drawn faintly because the optimizer
  never sees it. A candidate (blue) and its opposite (teal) are reflected
  through the centre of the box; the opposite lands in the basin, which is the
  premise opposition-based initialization runs on.</desc>

  <!-- Light and dark are both first-class: this renders on GitHub in either
       theme and on pdoc pages, which follow the reader's preference. -->
  <style>
    .cell    { fill: #f8fafc; stroke: #cbd5e1; }
    .contour { stroke: #cbd5e1; }
    .halo    { stroke: #ffffff; }
    .bg      { fill: #94a3b8; }
    .axis    { stroke: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      .cell    { fill: #0f172a; stroke: #334155; }
      .contour { stroke: #334155; }
      .halo    { stroke: #0f172a; }
      .bg      { fill: #64748b; }
      .axis    { stroke: #334155; }
    }
  </style>

  <defs>
    <!-- The landscape is bounded by the box, so the contours are clipped to
         it rather than sized to fit by hand. -->
    <clipPath id="box">
      <rect x="14" y="14" width="100" height="100" rx="16"/>
    </clipPath>
  </defs>

  <!-- the bounded search space -->
  <rect class="cell" x="14" y="14" width="100" height="100" rx="16" stroke-width="3"/>

  <!-- the basin, drawn faintly: it is there, the optimizer cannot see it -->
  <g class="contour" fill="none" stroke-width="1.6" stroke-dasharray="3.5 4.5"
     clip-path="url(#box)">
    <ellipse cx="86" cy="42" rx="9"  ry="7"  transform="rotate(-20 86 42)"/>
    <ellipse cx="86" cy="42" rx="18" ry="14" transform="rotate(-20 86 42)"/>
    <ellipse cx="86" cy="42" rx="27" ry="21" transform="rotate(-20 86 42)"/>
  </g>

  <!-- population -->
  <g class="bg">
    <circle cx="34" cy="42" r="4.5"/>
    <circle cx="55" cy="30" r="4.5"/>
    <circle cx="30" cy="70" r="4.5"/>
    <circle cx="66" cy="98" r="4.5"/>
    <circle cx="95" cy="88" r="4.5"/>
  </g>

  <!-- the reflection through the centre of the box: x_opp = a + b - x -->
  <g class="axis" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <line x1="42" y1="90" x2="86" y2="38"/>
  </g>
  <circle cx="64" cy="64" r="2.6" class="bg"/>

  <!-- candidate (blue) and its opposite (teal), which lands in the basin -->
  <circle class="halo" cx="42" cy="90" r="7.5" fill="#3b82f6" stroke-width="2.5"/>
  <circle class="halo" cx="86" cy="38" r="7.5" fill="#14b8a6" stroke-width="2.5"/>
</svg>
