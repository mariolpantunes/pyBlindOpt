[metadata]
name = pyBlindOpt
version = 0.4.0
author = Mário Antunes
author_email = mario.antunes@ua.pt
description = A library that implements several derivation-free optimization algorithms (such as genetic optimization).
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/mariolpantunes/pyBlindOpt
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.12
install_requires =
    numpy>=2.0.0
    joblib>=1.5.3
    tqdm>=4.67.3
    EmptySpaceSearch>=0.6.0

[options.extras_require]
# The gate's toolchain, pinned in one place so `pre-commit` and
# `.github/workflows` cannot run different versions of it. CI used to name
# the versions inline, which left no way to install locally what CI runs.
#
#   pip install -e ".[dev]"
dev =
    ruff==0.16.1
    basedpyright==1.39.8
    vulture==2.16
    coverage==7.14.2
    pre-commit

[options.packages.find]
where = src
